<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>원주고 앱</title>
  <meta name="description" content="원주고등학교 공식 앱 — 공지사항, 건의함, 익명게시판, 급식, 학사일정, 동아리, 설문, FAQ를 한곳에서." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ───────────── AUTH OVERLAY ───────────── -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🏫</div>
        <h1 class="auth-title">원주고등학교</h1>
        <p class="auth-subtitle">원주고 앱</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <h2 class="form-title">로그인</h2>
        <div class="form-group">
          <label for="login-email">이메일</label>
          <input type="email" id="login-email" placeholder="student@example.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">비밀번호</label>
          <input type="password" id="login-password" placeholder="비밀번호" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">로그인</button>
        <button type="button" class="btn btn-test btn-full" id="test-login-btn">🧪 테스트 계정으로 로그인</button>
        <p class="auth-switch">계정이 없으신가요? <button type="button" id="show-signup" class="link-btn">회원가입</button></p>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" class="auth-form hidden">
        <h2 class="form-title">회원가입</h2>
        <div class="form-row">
          <div class="form-group">
            <label for="signup-name">이름</label>
            <input type="text" id="signup-name" placeholder="홍길동" required />
          </div>
          <div class="form-group">
            <label for="signup-studentId">학번</label>
            <input type="text" id="signup-studentId" placeholder="20251234" required />
          </div>
        </div>
        <div class="form-row three-col">
          <div class="form-group">
            <label for="signup-grade">학년</label>
            <select id="signup-grade" required>
              <option value="">학년</option>
              <option value="1">1학년</option>
              <option value="2">2학년</option>
              <option value="3">3학년</option>
            </select>
          </div>
          <div class="form-group">
            <label for="signup-class">반</label>
            <input type="number" id="signup-class" placeholder="반" min="1" max="20" required />
          </div>
          <div class="form-group">
            <label for="signup-number">번호</label>
            <input type="number" id="signup-number" placeholder="번호" min="1" max="50" required />
          </div>
        </div>
        <div class="form-group">
          <label for="signup-email">이메일</label>
          <input type="email" id="signup-email" placeholder="student@example.com" required />
        </div>
        <div class="form-group">
          <label for="signup-password">비밀번호</label>
          <input type="password" id="signup-password" placeholder="6자 이상" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="signup-submit-btn">가입 신청</button>
        <p class="auth-switch">이미 계정이 있으신가요? <button type="button" id="show-login" class="link-btn">로그인</button></p>
      </form>
    </div>
  </div>

  <!-- ───────────── PENDING SCREEN ───────────── -->
  <div id="pending-screen" class="pending-screen hidden">
    <div class="pending-card">
      <div class="pending-icon">⏳</div>
      <h2>승인 대기 중</h2>
      <p>가입 신청이 완료되었습니다.<br />학생회 임원의 승인 후 이용 가능합니다.</p>
      <button id="pending-logout-btn" class="btn btn-outline">로그아웃</button>
    </div>
  </div>

  <!-- ───────────── MAIN APP ───────────── -->
  <div id="app" class="app hidden">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <span class="header-logo">🏫</span>
        <span class="header-title">원주고 앱</span>
      </div>
      <div class="header-right">
        <span id="header-user-info" class="header-user"></span>
        <button id="logout-btn" class="btn btn-sm btn-outline">로그아웃</button>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav" id="tab-nav" role="tablist" aria-label="메뉴">
      <!-- Tabs inserted by app.js -->
    </nav>

    <!-- Tab Content -->
    <main class="tab-content" id="tab-content" role="main">
      <!-- Content inserted by tab modules -->
    </main>
  </div>

  <!-- ───────────── TOAST ───────────── -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ───────────── MODAL ───────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Firebase SDK (CDN) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
